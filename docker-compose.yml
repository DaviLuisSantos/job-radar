# Local development database. Credentials are local-only defaults, not secrets.
services:
  postgres:
    image: postgres:18
    # Comes back with Docker Desktop (at login): the worker waits for it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
