# Local development database. Credentials are local-only defaults, not secrets.
# The project name is pinned: by default Compose names it after the folder, and the data volume
# (job-radar-au_pgdata) with it. Renaming the checkout would then start an empty database.
name: job-radar-au
services:
  postgres:
    image: postgres:18
    # Comes back with Docker Desktop (at login): the worker waits for it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      # This machine only: the containers reach it inside the compose network. Another port only to run a second stack
      # beside this one (JOBRADAR_DB_PORT, e.g. a test of the prod profile).
      - "127.0.0.1:${JOBRADAR_DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      retries: 10

  # ── Production (--profile prod): the whole JobRadar on any host with Docker (docs/producao.md). ──────────────
  # Machine settings come from .env next to this file (not versioned; deploy/prod.env.example shows them).
  # deploy/deploy.ps1 builds the images tagged with the commit and brings these up; the database above is the same.
  migrate:
    profiles: [prod]
    image: jobradar-migrate:${JOBRADAR_TAG:-local}
    build: { context: ., target: migrate, args: { COMMIT: "${JOBRADAR_COMMIT:-unknown}" } }
    environment:
      JOBRADAR_CONNECTION: Host=postgres;Port=5432;Database=jobradar;Username=jobradar;Password=jobradar
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  worker:
    profiles: [prod]
    image: jobradar-worker:${JOBRADAR_TAG:-local}
    build: { context: ., target: worker, args: { COMMIT: "${JOBRADAR_COMMIT:-unknown}" } }
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__JobRadar: Host=postgres;Port=5432;Database=jobradar;Username=jobradar;Password=jobradar
      # The reader's time zone, for the times in the logs; the pass keeps its own (Collection:TimeZone).
      TZ: ${JOBRADAR_TIMEZONE:-UTC}
    volumes:
      # The real profiles: a person's plans, never in the image or in git.
      - ${JOBRADAR_PROFILES:?set JOBRADAR_PROFILES in .env}:/srv/app/worker/appsettings.Local.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    profiles: [prod]
    image: jobradar-web:${JOBRADAR_TAG:-local}
    build: { context: ., target: web, args: { COMMIT: "${JOBRADAR_COMMIT:-unknown}" } }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__JobRadar: Host=postgres;Port=5432;Database=jobradar;Username=jobradar;Password=jobradar
      # No login in the app: only names the author reaches it by (localhost, the Tailscale address and name).
      AllowedHosts: ${JOBRADAR_ALLOWED_HOSTS:-localhost}
      # The site shows every time in the reader's zone: a container runs in UTC otherwise.
      TZ: ${JOBRADAR_TIMEZONE:-UTC}
    volumes:
      - ${JOBRADAR_PROFILES:?set JOBRADAR_PROFILES in .env}:/srv/app/web/profiles.json:ro
      - ${JOBRADAR_STATE:?set JOBRADAR_STATE in .env}:/srv/state:ro
    ports:
      # This machine only, and the Tailscale address when there is one; never every interface.
      - "127.0.0.1:${JOBRADAR_PORT:-5380}:8080"
      - "${JOBRADAR_TAILSCALE_IP:-127.0.0.2}:${JOBRADAR_PORT:-5380}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # The image has no curl: ask the site's own /status through bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /status HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Only with --profile sqlserver: the second database, for trying the SQL Server provider locally
  # (Database__Provider=SqlServer). Production does not use it.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: JobRadar-local-1
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

  # Only with --profile telemetry: a local view of the traces, metrics and logs of a pass. Point the worker and the
  # site at it with Telemetry__OtlpEndpoint=http://localhost:4317; the dashboard is at http://localhost:18888.
  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5.2
    profiles: [telemetry]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

volumes:
  pgdata:
  mssqldata:
