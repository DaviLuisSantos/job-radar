# Local development database. Credentials are local-only defaults, not secrets.
# The project name is pinned: by default Compose names it after the folder, and the data volume
# (job-radar-au_pgdata) with it. Renaming the checkout would then start an empty database.
name: job-radar-au
services:
  postgres:
    image: postgres:18
    # Comes back with Docker Desktop (at login): the worker waits for it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      retries: 10

  # Only with --profile sqlserver: the second database, for trying the SQL Server provider locally
  # (Database__Provider=SqlServer). Production does not use it.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: [sqlserver]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: JobRadar-local-1
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql

volumes:
  pgdata:
  mssqldata:
