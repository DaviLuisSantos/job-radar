name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # Hosted Ubuntu runners have Docker, so the Postgres contract tests run here too.
      - run: dotnet test --no-build -c Release
        env:
          JOBRADAR_DB_TESTS: "1"

  # Production runs these images (docker-compose.yml, profile prod): a Dockerfile that stops building fails here,
  # not in the deploy.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
          for target in migrate worker web; do
            docker build --target "$target" --build-arg COMMIT="$GITHUB_SHA" -t "jobradar-$target:ci" .
          done
