name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # Hosted Ubuntu runners have Docker, so the Postgres contract tests run here too.
      - run: dotnet test --no-build -c Release
        env:
          JOBRADAR_DB_TESTS: "1"
